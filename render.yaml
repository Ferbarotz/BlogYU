services:
  - type: web
    name: BlockYu
    runtime: python
    buildCommand: pip install -r requirements.txt && FLASK_APP=src.api:create_app flask db upgrade
    startCommand: gunicorn "src.api:create_app()" --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_APP
        value: src.api:create_app
